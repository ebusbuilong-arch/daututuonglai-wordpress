name: Build DTTL Screen Layout
on:
  push:
    paths: ['apps/screen-layout/**', 'tests/screen-layout/**', '.github/workflows/screen-layout.yml', 'wp-content/plugins/dttl-free-apps/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: php -l wp-content/plugins/dttl-free-apps/dttl-free-apps.php
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install test encoder
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Build and test Windows executable
        shell: powershell
        run: ./apps/screen-layout/build.ps1
      - name: Build WordPress package
        shell: python
        run: |
          import pathlib, base64, zipfile
          root=pathlib.Path('wp-content/plugins/dttl-free-apps')
          data=pathlib.Path('apps/screen-layout/dist/DTTL-Chia-Man-Hinh-0.2.3-beta.zip').read_bytes()
          (root/'payload.php').write_text("<?php\nif (!defined('ABSPATH')) { http_response_code(403); exit; }\nreturn '"+base64.b64encode(data).decode()+"';\n")
          with zipfile.ZipFile('apps/screen-layout/dist/dttl-free-apps.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,str(pathlib.Path('dttl-free-apps')/p.relative_to(root)))
      - uses: actions/upload-artifact@v4
        with:
          name: DTTL-Screen-Layout-beta
          path: |
            apps/screen-layout/dist/DTTL-Chia-Man-Hinh-0.2.3-beta.zip
            apps/screen-layout/dist/dttl-free-apps.zip
            apps/screen-layout/dist/app-preview.png
            apps/screen-layout/dist/workspace-preview.png
            apps/screen-layout/dist/DTTL-Workspace-0.6.1-thu-nghiem.zip
          retention-days: 30
