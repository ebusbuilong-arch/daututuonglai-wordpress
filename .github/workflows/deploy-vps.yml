name: DTTL - Deploy VPS

on:
  push:
    branches: [main]
    paths: ['wp-content/**', '.github/workflows/deploy-vps.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dttl-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and package changed files
        id: package
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/deploy.py build "$BEFORE" "$AFTER" "$RUNNER_TEMP/release.json"
          if ! git diff --quiet "$BEFORE" "$AFTER" -- wp-content; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/dttl_actions"
          host_label="$VPS_HOST"
          if [ "$VPS_PORT" != 22 ]; then host_label="[$VPS_HOST]:$VPS_PORT"; fi
          printf '%s %s\n' "$host_label" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILcY6kITMRi7ho4xaf0+lxgkH1LDbp/losU415CclxbI' > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/dttl_actions" >/dev/null
          cat > "$HOME/.ssh/config" <<EOF
          Host dttl-vps
            HostName $VPS_HOST
            Port $VPS_PORT
            User $VPS_USER
            IdentityFile ~/.ssh/dttl_actions
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          EOF
      - name: Check VPS connection (manual runs stop here)
        run: ssh dttl-vps 'python3 - check' < scripts/deploy.py
      - name: Deploy guarded release
        if: github.event_name == 'push' && steps.package.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_dir=$(ssh dttl-vps 'umask 077; mktemp -d /tmp/dttl-release.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/dttl-release\.[a-zA-Z0-9]+$ ]]
          trap 'ssh dttl-vps "rm -f $remote_dir/deploy.py $remote_dir/release.json; rmdir $remote_dir" || true' EXIT
          scp scripts/deploy.py "$RUNNER_TEMP/release.json" "dttl-vps:$remote_dir/"
          ssh dttl-vps "python3 $remote_dir/deploy.py apply $remote_dir/release.json"
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/dttl_actions"
